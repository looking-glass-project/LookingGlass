name: Linux checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA headers (rodio/cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Rust unit tests (no game data)
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
