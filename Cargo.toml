[package]
name = "looking-glass"
version = "0.33.0-preview.4"
edition = "2021"
rust-version = "1.86"
publish = false
description = "Local Rust compatibility research for user-supplied Alice game data"

[dependencies]
anyhow = "1.0"
macroquad = "=0.4.14"
# Same version macroquad uses; named here to turn on the vendored Vulkan backend.
miniquad = { version = "=0.4.8", features = ["vulkan"] }
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
image = { version = "=0.24.9", default-features = false, features = ["tga", "jpeg", "png"] }
# Macroquad's newer fontdue patch needs a newer compiler than the user's Rust 1.86.
fontdue = "=0.9.3"
# Independent WAV/MP3 playback; does not load the game's Miles DLLs.
rodio = { version = "=0.20.1", default-features = false, features = ["wav", "symphonia-mp3"] }
hound = "=3.5.1"
# Symphonia metadata's latest encoding_rs patch requires Rust 1.88.
encoding_rs = "=0.8.35"
deunicode = "=1.6.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
# Enable serialization on the same math types used by Macroquad.
glam = { version = "=0.27.0", features = ["serde"] }
sha2 = "=0.10.9"
tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
getrandom = "=0.3.4"
# Already present through ZIP; use the same pinned codec for bounded co-op state.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[build-dependencies]
sha2 = "=0.10.9"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"

[target.'cfg(target_os = "freebsd")'.dependencies]
# PS5 std glue (kevent/stat/getrandom shims) from neokuze/ps5-rust 19a6ac0 (GPL-3.0-or-later),
# vendored with one change: PS5_STD_RT_TITLE=1 skips its bundled libc copy (see vendor/ps5-std-rt/PS5_PORT.md).
ps5-std-rt = { path = "vendor/ps5-std-rt" }

[patch.crates-io]
cpal = { path = "vendor/cpal" }
miniquad = { path = "vendor/miniquad" }
macroquad = { path = "vendor/macroquad" }
